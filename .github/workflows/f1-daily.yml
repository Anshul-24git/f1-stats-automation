name: F1 Stats Automation

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update F1 Stats
        run: python scripts/update_f1_standings.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add -A
          git diff --cached --quiet || (git commit -m "chore: update F1 standings ($(date -u +'%Y-%m-%d %H:%M:%S'))" && git push)